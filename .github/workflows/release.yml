name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package (for example v1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Test and package
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify tag and version sources
        id: version
        shell: pwsh
        run: |
          Import-Module ./modules/XboxOS.Build/XboxOS.Build.psd1 -Force
          $check = Test-XboxOSReleaseVersionConsistency
          if (-not $check.consistent) { throw ($check.errors -join "`n") }
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          if ($tag -ne "v$($check.version)") { throw "Tag '$tag' does not match VERSION '$($check.version)'." }
          "version=$($check.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Pester
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $result = Invoke-Pester -Configuration $config
          if ($null -ne $result -and $result.FailedCount -gt 0) { throw "Pester reported $($result.FailedCount) failure(s)." }

      - name: .NET tests
        shell: pwsh
        run: dotnet test tests/dotnet/XboxOS11.Builder.Core.Tests/XboxOS11.Builder.Core.Tests.csproj -c Release

      - name: Package
        shell: pwsh
        run: ./scripts/New-XboxOSRelease.ps1 -OutputDirectory "$env:RUNNER_TEMP/release" -Runtime win-x64, win-arm64

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: xboxos11-release
          path: ${{ runner.temp }}/release/${{ steps.version.outputs.version }}/*
          if-no-files-found: error

  draft-release:
    name: Create draft GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: xboxos11-release
          path: release

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh release create "v$VERSION" release/* \
            --draft \
            --title "XboxOS11 $VERSION" \
            --notes-file notes.md \
            --verify-tag
