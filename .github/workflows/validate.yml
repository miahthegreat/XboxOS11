name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Manifests, PSScriptAnalyzer, Pester
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        shell: pwsh
        run: |
          $required = @(
            'config/build.json',
            'config/remove-apps.json',
            'config/disable-features.json',
            'config/services.json',
            'config/drivers.json',
            'config/compatibility.json',
            'config/dependency-evidence.json',
            'config/capability-requirements.json',
            'modules/XboxOS.Build/XboxOS.Build.psd1',
            'modules/XboxOS.Build/XboxOS.Build.psm1',
            'scripts/Build-ISO.ps1',
            'scripts/Test-Prerequisites.ps1',
            'scripts/Import-Source.ps1',
            'scripts/Mount-Image.ps1',
            'scripts/Inventory-Image.ps1',
            'scripts/Remove-Apps.ps1',
            'scripts/Disable-Features.ps1',
            'scripts/Add-Updates.ps1',
            'scripts/Add-Drivers.ps1',
            'scripts/Validate-Image.ps1',
            'scripts/Dismount-Image.ps1',
            'scripts/Export-ISO.ps1',
            'scripts/Test-DismCompatibility.ps1',
            'postinstall/Setup-Gaming.ps1',
            'postinstall/Setup-XboxMode.ps1',
            'postinstall/Install-Launchers.ps1',
            'postinstall/Verify-System.ps1',
            'tests/Build.Tests.ps1',
            'tests/Manifest.Tests.ps1',
            'tests/Safety.Tests.ps1',
            'tests/Syntax.Tests.ps1',
            'tests/Pipeline.Tests.ps1',
            'tests/ImageIndex.Tests.ps1',
            'tests/DismCompat.Tests.ps1',
            'tests/Inventory.Tests.ps1',
            'scripts/Build-CompatibilityMatrix.ps1',
            'docs/m1-compatibility-baseline.md',
            'docs/XboxOS11-compatibility-matrix-26300.9457.md',
            'docs/m2-servicing-plan-contracts.md',
            'docs/m2-operation-ordering-and-recovery.md',
            'docs/m2-implementation-notes.md',
            'docs/m2-canonical-plan-hash.md',
            'docs/m2-completion-baseline.md',
            'docs/m3-execution-safety-contracts.md',
            'docs/m3-transaction-state-machine.md',
            'docs/m3-implementation-notes.md',
            'docs/m3-unresolved-risks.md',
            'docs/m3-completion-baseline.md',
            'docs/m4-disposable-image-preflight-contracts.md',
            'docs/m4-implementation-notes.md',
            'docs/m4-unresolved-risks.md',
            'docs/m4-completion-baseline.md',
            'docs/m5-dependency-evidence-contracts.md',
            'docs/m5-future-modification-test-strategy.md',
            'docs/m5-implementation-notes.md',
            'docs/m5-unresolved-risks.md',
            'modules/XboxOS.Build/ServicingPlan.ps1',
            'modules/XboxOS.Build/ExecutionSafety.ps1',
            'modules/XboxOS.Build/DisposableImagePreflight.ps1',
            'modules/XboxOS.Build/ServicingReadiness.ps1',
            'scripts/New-ServicingPlan.ps1',
            'scripts/Test-ExecutionSafety.ps1',
            'scripts/Test-DisposableImagePreflight.ps1',
            'scripts/Test-ServicingReadiness.ps1',
            'scripts/Test-DisposableExperimentPlan.ps1',
            'scripts/Test-IsolatedLabReadiness.ps1',
            'tests/ServicingPlan.Tests.ps1',
            'tests/ExecutionSafety.Tests.ps1',
            'tests/DisposableImagePreflight.Tests.ps1',
            'tests/ServicingReadiness.Tests.ps1',
            'tests/DisposableExperimentPlan.Tests.ps1',
            'tests/IsolatedLab.Tests.ps1',
            'tests/Fixtures/approval-auth/test-approval-public.pem',
            'tests/Fixtures/approval-auth/test-approval-private.pem',
            'config/lab-topology.json',
            'config/functional-validation-matrix.json',
            'modules/XboxOS.Build/DisposableExperimentPlan.ps1',
            'modules/XboxOS.Build/IsolatedLab.ps1',
            'docs/m6b-lab-infrastructure-contracts.md',
            'docs/m6b-vm-isolation-policy.md',
            'docs/m6b-integrity-recovery.md',
            'docs/m6b-evidence-custody.md',
            'docs/m6b-unresolved-risks.md',
            'docs/m6b-pssa-warning-review.md',
            'docs/m6b-completion-baseline.md',
            'docs/m6c-real-host-lab-discovery-design.md',
            'docs/m6c-host-discovery-contracts.md',
            'docs/m6c-completion-baseline.md',
            'docs/m6d-authorized-readonly-host-inspection-design.md',
            'docs/m6d-readonly-host-adapter.md',
            'docs/m6d-operator-authorization.md',
            'docs/m6d-isolation-evidence.md',
            'docs/m6d-operational-runbook.md',
            'docs/m6d-unresolved-risks.md',
            'docs/m6d-completion-baseline.md',
            'docs/m6e-controlled-live-discovery-design.md',
            'config/host-discovery-allowlist.json',
            'modules/XboxOS.Build/HostLabDiscovery.ps1',
            'modules/XboxOS.Build/AuthorizedHostDiscovery.ps1',
            'scripts/Test-HostLabDiscovery.ps1',
            'scripts/Test-AuthorizedHostDiscovery.ps1',
            'tests/HostLabDiscovery.Tests.ps1',
            'tests/AuthorizedHostDiscovery.Tests.ps1',
            'modules/XboxOS.Build/ControlledLiveDiscovery.ps1',
            'scripts/Invoke-ControlledLiveHostDiscovery.ps1',
            'scripts/New-ControlledLiveDiscoveryApproval.ps1',
            'scripts/New-ControlledLiveDiscoverySigningKey.ps1',
            'tests/ControlledLiveDiscovery.Tests.ps1',
            'docs/m6e-controlled-live-discovery-contracts.md',
            'modules/XboxOS.Build/BuilderProfile.ps1',
            'scripts/Invoke-XboxOSBuild.ps1',
            'scripts/Invoke-XboxOSBuilderApi.ps1',
            'postinstall/Invoke-PostInstall.ps1',
            'config/presets/gaming-balanced.json',
            'tests/BuilderProfile.Tests.ps1',
            'docs/m7-builder-backend-contracts.md',
            'README.md',
            'LICENSE'
          )
          $missing = @()
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { $missing += $path }
          }
          if ($missing.Count -gt 0) {
            throw "Missing required paths:`n$($missing -join "`n")"
          }

      - name: Validate JSON configuration
        shell: pwsh
        run: |
          Get-ChildItem config -Filter *.json | ForEach-Object {
            Write-Host "Parsing $($_.FullName)"
            Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }

      - name: Validate PowerShell syntax (Parser::ParseFile)
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem -Recurse -Include *.ps1, *.psm1 -File |
              Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          )
          $totalErrors = 0
          foreach ($file in $files) {
            $parseErrors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            $count = @($parseErrors).Count
            $totalErrors += $count
            if ($count -gt 0) {
              Write-Host ("FAIL {0} => {1} error(s)" -f $file.FullName, $count)
              $parseErrors | ForEach-Object {
                Write-Host ("  L{0}: {1}" -f $_.Extent.StartLineNumber, $_.Message)
              }
            }
            else {
              Write-Host ("OK   {0}" -f $file.FullName)
            }
          }
          Write-Host ("ParsedFileCount={0}" -f $files.Count)
          Write-Host ("PARSER_ERROR_COUNT={0}" -f $totalErrors)
          if ($totalErrors -ne 0) {
            throw ("PowerShell parser reported {0} error(s) across {1} file(s)." -f $totalErrors, $files.Count)
          }

      - name: Install PSScriptAnalyzer and Pester 5+
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @()
          foreach ($path in @('modules', 'scripts', 'postinstall', 'tests')) {
            $results += Invoke-ScriptAnalyzer -Path $path -Recurse -Severity @('Error', 'Warning') -ExcludeRule @(
              'PSUseShouldProcessForStateChangingFunctions',
              'PSAvoidUsingWriteHost',
              'PSUseDeclaredVarsMoreThanAssignments'
            )
          }
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            $errors = @($results | Where-Object Severity -eq 'Error')
            if ($errors.Count -gt 0) {
              throw "PSScriptAnalyzer reported $($errors.Count) error(s)."
            }
            Write-Warning "PSScriptAnalyzer reported $($results.Count) warning(s)."
          }
          else {
            Write-Host 'PSScriptAnalyzer found no issues.'
          }

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'PesterResults.xml'
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($null -ne $result -and $result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failing test(s)."
          }

      - name: Ensure no Windows media artifacts staged
        shell: pwsh
        run: |
          $forbidden = Get-ChildItem -Recurse -File -Include *.iso,*.wim,*.esd,*.swm,*.msu,*.cab -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\tests\\Fixtures\\' }
          if ($forbidden) {
            throw "Windows media/update binaries must not be committed:`n$($forbidden.FullName -join "`n")"
          }
          Write-Host 'No proprietary Windows image artifacts detected in the repository tree.'
